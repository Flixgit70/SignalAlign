name: SignalAlign Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-macos:
    name: macOS ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout SignalAlign
        uses: actions/checkout@v4

      - name: Checkout JUCE 8.0.15
        uses: actions/checkout@v4
        with:
          repository: juce-framework/JUCE
          ref: 8.0.15
          path: JUCE

      - name: Verify release version
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
            grep -q "project(SignalAlign VERSION ${VERSION})" CMakeLists.txt
            grep -q "VERSION ${VERSION}" CMakeLists.txt
          fi

      - name: Configure
        shell: bash
        run: |
          cmake -S . -B build_ci \
            -DJUCE_PATH="${GITHUB_WORKSPACE}/JUCE" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES=${{ matrix.arch }}

      - name: Build
        shell: bash
        run: |
          cmake --build build_ci --config Release --parallel 3 --target \
            SignalAlign_VST3 \
            SignalAlign_Standalone \
            SignalAlign16_VST3

      - name: Package
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME}"
          rm -rf package
          mkdir -p package

          cp -R "build_ci/SignalAlign_artefacts/Release/VST3/SignalAlign.vst3" package/
          cp -R "build_ci/SignalAlign_artefacts/Release/Standalone/SignalAlign.app" package/
          cp -R "build_ci/SignalAlign16_artefacts/Release/VST3/SignalAlign 16.vst3" package/

          ditto -c -k --sequesterRsrc --keepParent \
            package \
            "SignalAlign-${VERSION}-macOS-${{ matrix.arch }}.zip"

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: SignalAlign-${{ github.ref_name }}-macOS-${{ matrix.arch }}
          path: SignalAlign-${{ github.ref_name }}-macOS-${{ matrix.arch }}.zip
          if-no-files-found: error

  build-windows:
    name: Windows x86_64
    runs-on: windows-2022

    steps:
      - name: Checkout SignalAlign
        uses: actions/checkout@v4

      - name: Checkout JUCE 8.0.15
        uses: actions/checkout@v4
        with:
          repository: juce-framework/JUCE
          ref: 8.0.15
          path: JUCE

      - name: Verify release version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME.TrimStart("v")
          $cmake = Get-Content CMakeLists.txt -Raw
          if ($cmake -notmatch "project\(SignalAlign VERSION $([regex]::Escape($version))\)") {
              throw "Tag version $version does not match CMake project version."
          }

      - name: Configure
        shell: pwsh
        run: |
          cmake `
            -S . `
            -B build_ci `
            -G "Visual Studio 17 2022" `
            -A x64 `
            "-DJUCE_PATH=$env:GITHUB_WORKSPACE\JUCE"

      - name: Build
        shell: pwsh
        run: |
          cmake `
            --build build_ci `
            --config Release `
            --parallel 2 `
            --target `
              SignalAlign_VST3 `
              SignalAlign_Standalone `
              SignalAlign16_VST3

      - name: Package
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME
          Remove-Item package -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory package | Out-Null

          Copy-Item "build_ci\SignalAlign_artefacts\Release\VST3\SignalAlign.vst3" package -Recurse
          Copy-Item "build_ci\SignalAlign_artefacts\Release\Standalone\SignalAlign.exe" package
          Copy-Item "build_ci\SignalAlign16_artefacts\Release\VST3\SignalAlign 16.vst3" package -Recurse

          Compress-Archive `
            -Path package\* `
            -DestinationPath "SignalAlign-$version-Windows-x86_64.zip" `
            -Force

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: SignalAlign-${{ github.ref_name }}-Windows-x86_64
          path: SignalAlign-${{ github.ref_name }}-Windows-x86_64.zip
          if-no-files-found: error

  build-linux:
    name: Linux x86_64
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout SignalAlign
        uses: actions/checkout@v4

      - name: Checkout JUCE 8.0.15
        uses: actions/checkout@v4
        with:
          repository: juce-framework/JUCE
          ref: 8.0.15
          path: JUCE

      - name: Install Linux dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            pkg-config \
            zip \
            libasound2-dev \
            libjack-jackd2-dev \
            libfreetype6-dev \
            libfontconfig1-dev \
            libx11-dev \
            libxext-dev \
            libxinerama-dev \
            libxrandr-dev \
            libxcursor-dev \
            libxcomposite-dev \
            libxrender-dev \
            libgl1-mesa-dev \
            libglu1-mesa-dev

      - name: Verify release version
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
            grep -q "project(SignalAlign VERSION ${VERSION})" CMakeLists.txt
            grep -q "VERSION ${VERSION}" CMakeLists.txt
          fi

      - name: Configure
        shell: bash
        run: |
          cmake -S . -B build_ci \
            -DJUCE_PATH="${GITHUB_WORKSPACE}/JUCE" \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build
        shell: bash
        run: |
          cmake --build build_ci --config Release --parallel 2 --target \
            SignalAlign_VST3 \
            SignalAlign_Standalone \
            SignalAlign16_VST3

      - name: Package
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME}"
          rm -rf package
          mkdir -p package

          cp -R "build_ci/SignalAlign_artefacts/Release/VST3/SignalAlign.vst3" package/
          cp "build_ci/SignalAlign_artefacts/Release/Standalone/SignalAlign" package/
          cp -R "build_ci/SignalAlign16_artefacts/Release/VST3/SignalAlign 16.vst3" package/

          zip -r "SignalAlign-${VERSION}-Linux-x86_64.zip" package

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: SignalAlign-${{ github.ref_name }}-Linux-x86_64
          path: SignalAlign-${{ github.ref_name }}-Linux-x86_64.zip
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs:
      - build-macos
      - build-windows
      - build-linux
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04

    steps:
      - name: Download all builds
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create or update release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -lah dist

          if gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" dist/* \
              --repo "${GITHUB_REPOSITORY}" \
              --clobber
          else
            gh release create "${GITHUB_REF_NAME}" dist/* \
              --repo "${GITHUB_REPOSITORY}" \
              --title "SignalAlign ${GITHUB_REF_NAME}" \
              --generate-notes
          fi
